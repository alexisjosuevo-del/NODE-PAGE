<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODE Interactivo - Tablet View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.5);
            --bg-dark: #050508;
            --glass-bg: rgba(20, 20, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 204, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(100, 50, 255, 0.1) 0%, transparent 50%);
        }

        /* SIDEBAR (Menú Interactivo) */
        .sidebar {
            width: 300px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .sidebar-header h2 {
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }
        .sidebar-header span {
            color: var(--primary);
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom scrollbar para el menú */
        .menu-list::-webkit-scrollbar { width: 4px; }
        .menu-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .menu-item {
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            color: #888;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
        }

        .menu-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform 0.4s ease;
            transform-origin: bottom;
        }

        .menu-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }

        .menu-item.active {
            color: #fff;
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 20px var(--primary-glow) inset;
        }

        .menu-item.active::before {
            transform: scaleY(1);
        }

        /* MAIN CONTAINER */
        .main-view {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            perspective: 1500px;
        }

        /* DISEÑO DE LA TABLET (Horizontal para que encajen las gráficas) */
        .tablet-container {
            position: relative;
            width: 850px;
            height: 550px;
            border-radius: 35px;
            background: #111;
            /* Bordes metálicos de la tablet */
            box-shadow: 
                0 0 0 10px #222,
                0 0 0 12px #444,
                0 0 0 14px #111,
                30px 40px 60px rgba(0,0,0,0.8),
                -10px -10px 30px rgba(0, 255, 204, 0.1);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Cámara de la tablet */
        .tablet-container::before {
            content: '';
            position: absolute;
            left: -15px; /* Bezel izquierdo */
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: #050510;
            border-radius: 50%;
            box-shadow: inset 0 0 2px rgba(255,255,255,0.4);
            z-index: 100;
        }

        /* La pantalla real de la tablet */
        .tablet-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 25px; /* Borde interior de la pantalla */
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid #0a0a0a;
        }

        /* El contenedor de la imagen para animarla */
        .image-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }

        /* Imagen que se visualiza */
        .screen-image {
            width: 100%;
            height: 100%;
            /* Utilizamos 'contain' y un leve 'cover' virtual escalando para que no se recorte tanto */
            object-fit: cover; 
            opacity: 0;
            transition: opacity 0.6s ease;
            /* La animación panea la gráfica para que parezca que los datos fluyen */
            animation: panDashboard 25s infinite alternate ease-in-out;
            transform-origin: center center;
        }

        .screen-image.loaded {
            opacity: 1;
        }

        /* Movimiento de exploración sobre los gráficos */
        @keyframes panDashboard {
            0% { transform: scale(1.1) translate(0%, 0%); }
            25% { transform: scale(1.2) translate(-3%, -2%); }
            50% { transform: scale(1.15) translate(2%, 3%); }
            75% { transform: scale(1.2) translate(3%, -3%); }
            100% { transform: scale(1.1) translate(0%, 0%); }
        }

        /* OVERLAYS TECNOLÓGICOS */
        .tech-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 10;
        }
        
        /* Línea de análisis (scanner) */
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 20px 4px var(--primary-glow);
            opacity: 0.5;
            animation: scanTablet 4s linear infinite;
        }

        @keyframes scanTablet {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* Puntos de datos parpadeantes para simular interactividad */
        .data-point {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 5px var(--primary-glow);
            animation: pulseData 2s infinite alternate;
        }
        .dp1 { top: 30%; left: 40%; animation-delay: 0s; }
        .dp2 { top: 60%; left: 70%; animation-delay: 0.5s; }
        .dp3 { top: 20%; left: 80%; animation-delay: 1s; }

        @keyframes pulseData {
            0% { transform: scale(0.5); opacity: 0.3; }
            100% { transform: scale(1.5); opacity: 0.9; }
        }

        /* Header App simulado en la tablet */
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 25px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--primary);
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* Loader */
        .loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border: 4px solid rgba(0,255,204,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            display: none;
            z-index: 50;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Menú Lateral Interactivo -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>NODE<span>.App</span></h2>
        </div>
        <ul class="menu-list" id="menuList">
            <!-- Los items del menú se generan con JS para poder editarlos fácilmente -->
        </ul>
    </aside>

    <!-- Vista Principal -->
    <main class="main-view">
        
        <!-- Tablet CSS Horizontal -->
        <div class="tablet-container">
            <div class="tablet-screen">
                
                <!-- Cabecera de la App -->
                <div class="app-header">
                    <span class="app-title" id="appTitle">Cargando...</span>
                    <span style="font-size: 13px; font-weight: bold; color: #fff;">100% 🔋</span>
                </div>
                
                <!-- Contenedor con animación y la Imagen de la Gráfica -->
                <div class="image-wrapper">
                    <img src="img1.png" class="screen-image loaded" id="displayImage">
                </div>
                
                <!-- Efectos dinámicos encima de la imagen -->
                <div class="tech-overlay">
                    <div class="scanner-line"></div>
                    <div class="data-point dp1"></div>
                    <div class="data-point dp2"></div>
                    <div class="data-point dp3"></div>
                </div>

                <div class="loader" id="loader"></div>
            </div>
        </div>

    </main>

    <script>
        // CONFIGURACIÓN DE TÍTULOS E IMÁGENES
        const menuItems = [
            { id: 'img1', src: 'img1.png', title: 'Dashboard Principal' },
            { id: 'img2', src: 'img2.png', title: 'Módulo de CRM' },
            { id: 'img3', src: 'img3.png', title: 'Analítica Avanzada' },
            { id: 'img4', src: 'img4.png', title: 'Reporte de Operaciones' },
            { id: 'img5', src: 'img5.png', title: 'Flujo Financiero' },
            { id: 'img6', src: 'img6.png', title: 'Métricas de Marketing' },
            { id: 'img7', src: 'img7.png', title: 'Rendimiento Global' },
            { id: 'img8', src: 'img8.png', title: 'Configuración del Sistema' },
        ];

        // Construir el menú dinámicamente
        const menuList = document.getElementById('menuList');
        
        menuItems.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'menu-item' + (index === 0 ? ' active' : '');
            li.textContent = item.title;
            li.onclick = function() {
                loadModule(item.src, item.title, this);
            };
            menuList.appendChild(li);
        });

        // Cargar el primer elemento por defecto
        document.getElementById('appTitle').textContent = menuItems[0].title;

        // Lógica de cambio de módulos (imágenes interactivas)
        function loadModule(imageSrc, title, element) {
            // Actualizar menú activo
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const img = document.getElementById('displayImage');
            const loader = document.getElementById('loader');
            const titleEl = document.getElementById('appTitle');
            
            // Efecto de transición
            img.classList.remove('loaded');
            loader.style.display = 'block';

            setTimeout(() => {
                img.src = imageSrc;
                titleEl.textContent = title;
                
                // Mover aleatoriamente los puntos de datos para que se vea diferente
                document.querySelectorAll('.data-point').forEach(dp => {
                    dp.style.top = (20 + Math.random() * 60) + '%';
                    dp.style.left = (20 + Math.random() * 60) + '%';
                });

                // Cuando la imagen nueva carga, la mostramos
                img.onload = () => {
                    loader.style.display = 'none';
                    img.classList.add('loaded');
                };
            }, 400); // Retraso simulando carga de datos
        }

        // Efecto Parallax 3D interactivo con el mouse (como contentcore.xyz)
        const mainView = document.querySelector('.main-view');
        const tablet = document.querySelector('.tablet-container');

        mainView.addEventListener('mousemove', (e) => {
            // Calculamos el centro de la pantalla
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // Calculamos cuánto se ha movido el mouse desde el centro
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            // Calculamos la rotación (dividir entre un número más grande hace que gire menos)
            const rotateX = ((centerY - mouseY) / 25).toFixed(2);
            const rotateY = ((mouseX - centerX) / 25).toFixed(2);
            
            // Aplicar la rotación y un ligero efecto de profundidad 3D
            tablet.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(20px)`;
        });

        // Resetear la rotación de forma suave cuando el mouse sale de la ventana
        mainView.addEventListener('mouseleave', () => {
            tablet.style.transition = "transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)";
            tablet.style.transform = `rotateX(0deg) rotateY(0deg) translateZ(0px)`;
        });

        // Volver a la transición rápida para que el movimiento sea fluido
        mainView.addEventListener('mouseenter', () => {
            tablet.style.transition = "transform 0.1s ease-out";
        });
    </script>
</body>
</html>
